name: Linux build

on: [pull_request]

jobs:
  build-go-linux:
    name: build-go-linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25.2'

      - name: Build and test
        run: go build -a ./... && go test -a -v ./... -count=1

  build-cwrapper-linux:
    name: build-cwrapper-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/bignacio/docker-images/ubuntu-cpp-25.10:1
      credentials:
        username: bignacio
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        compiler: [gcc-15, clang-21]

    steps:
    - uses: actions/checkout@v3

    - name: Build and test
      env:
        CC: ${{matrix.compiler}}
        CXX: clang++-21 # needed to make cmake happy
      run: |
        set -e
        apt install zlib1g-dev
        cd zwrapper
        rm -rf build
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        make -C build
        build/zwrapper_test_direct
        build/zwrapper_test_stream
